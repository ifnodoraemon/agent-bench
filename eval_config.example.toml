# ==============================================================================
# agent-bench 示例配置
# 用法: cp eval_config.example.toml eval_config.toml
# 密钥请放在环境变量中（支持 env:VAR），不要把真实密钥提交进仓库。
#
# 注意:
# - Agent/CodeExecution 需要 bubblewrap(bwrap)；未安装时默认拒绝执行。
# - Judge 可选；没有 judge 时 llm_judge 与依赖 criteria 的 agent 题会失败，而不会猜分。
# - Dashboard 默认禁止 Web 请求覆盖 base_url/api_key/protocol；自定义端点需
#   `agent-bench dashboard --allow-custom-endpoints`，且自定义 base_url 必须显式给 api_key。
# - 本文件中的 2026 模型名称/价格仅作配置示例；基线库中的 verified=false 条目不会参与漂移判定。
# ==============================================================================

# ==============================================================================
# 🦀 agent-bench 2026 最新旗舰大模型与 Agent 评测配置示例
# 架构原则：protocol 显式指定传输协议格式 ("openai_chat" | "openai_response" | "anthropic" | "gemini" | "mock")
# 环境变量解析：支持通过 "env:VARIABLE_NAME" 自动安全注入 API 密钥与服务端点
# ==============================================================================

[benchmark]
concurrency = 8
output_dir = "./results"
save_json = true
save_markdown = true
save_html = true

# ==============================================================================
# ==============================================================================
# LLM-as-a-Judge 专家裁判模型配置 (用于 Agent 轨迹 Trajectory 与开放式主观判定)
# 推荐采用 Claude Opus 5.5, GPT-6 Astra 或 DeepSeek-V4 等 2026 前沿推理自洽模型
# ==============================================================================
[judge]
id = "judge-claude-opus-5-5"
protocol = "anthropic"
model_name = "claude-opus-5.5"
base_url = "https://api.anthropic.com/v1"
api_key = "env:ANTHROPIC_API_KEY"
temperature = 0.0

# ==============================================================================
# 待评测大模型列表 (涵盖 2026 最新前沿推理模型、智能体模型及多模态基座)
# ==============================================================================

# 1. Anthropic Claude Opus 5.5 (2026-09): 前沿智能体与 Terminal-Bench 榜首旗舰
[[models]]
id = "claude-opus-5-5"
protocol = "anthropic"
model_name = "claude-opus-5.5"
base_url = "https://api.anthropic.com/v1"
api_key = "env:ANTHROPIC_API_KEY"
temperature = 0.0
price_per_input_million = 5.00
price_per_output_million = 25.00

# 2. OpenAI GPT-6 Astra (2026-09): 原生系统级 Computer Use 与自主 Agent 旗舰
[[models]]
id = "gpt-6-astra"
protocol = "openai_chat"
model_name = "gpt-6-astra"
base_url = "https://api.openai.com/v1"
api_key = "env:OPENAI_API_KEY"
temperature = 0.0
price_per_input_million = 10.00
price_per_output_million = 50.00

# 3. Moonshot Kimi K3 (2026-07): 2.8T 稀疏 MoE 架构，Web 前端与 1M 上下文旗舰
[[models]]
id = "kimi-k3"
protocol = "openai_chat"
model_name = "kimi-k3"
base_url = "https://api.moonshot.cn/v1"
api_key = "env:MOONSHOT_API_KEY"
temperature = 0.0
price_per_input_million = 1.00
price_per_output_million = 4.00

# 4. Alibaba Qwen 3.8-Max (2026-08): 阿里云百炼千问顶级智能体旗舰 (Terminal 86.6%)
[[models]]
id = "qwen-3-8-max"
protocol = "openai_chat"
model_name = "qwen-3.8-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "env:DASHSCOPE_API_KEY"
temperature = 0.0
price_per_input_million = 2.00
price_per_output_million = 8.00

# 5. Google Gemini 3.8 Flash (2026-09): 原生全模态、流式极速响应与突破 1500 Elo 标杆
[[models]]
id = "gemini-3-8-flash"
protocol = "gemini"
model_name = "gemini-3.8-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key = "env:GEMINI_API_KEY"
temperature = 0.0
price_per_input_million = 0.20
price_per_output_million = 0.80

# 6. DeepSeek-V4: 下一代极速稀疏超大杯架构与动态思考流 (SWE 74.5%)
[[models]]
id = "deepseek-v4"
protocol = "openai_chat"
model_name = "deepseek-v4"
base_url = "https://api.deepseek.com/v1"
api_key = "env:DEEPSEEK_API_KEY"
temperature = 0.0
price_per_input_million = 0.30
price_per_output_million = 1.20

# 7. 私有化集群部署 (vLLM / SGLang / GPUStack: 例如本地蒸馏推理模型)
[[models]]
id = "deepseek-r1-local-32b"
protocol = "openai_chat"
model_name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
base_url = "http://localhost:8000/v1"
